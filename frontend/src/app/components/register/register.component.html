<div class="auth-page">
  <div class="auth-card">
    <!-- Brand Header -->
    <div class="auth-header">
      <div class="auth-logo-badge">
        <svg class="ticket-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
          <path d="M13 5v2"/>
          <path d="M13 17v2"/>
          <path d="M13 11v2"/>
        </svg>
      </div>
      <h1 class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Get started with <strong>Support Ticket</strong> today</p>
    </div>

    <!-- Error Alert Banner -->
    <div *ngIf="errorMessage" class="alert-error" role="alert">
      <div class="alert-content">
        <svg class="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    </div>

    <!-- Register Form -->
    <form (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="name"
            placeholder="Alice Johnson"
            autocomplete="name"
            required
            [disabled]="isLoading"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="alice@example.com"
            autocomplete="email"
            required
            [disabled]="isLoading"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="label-hint">(min. 6 characters)</span></label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Create a password"
            autocomplete="new-password"
            required
            [disabled]="isLoading"
          />
        </div>
      </div>

      <button type="submit" [disabled]="isLoading" class="btn-submit">
        <span *ngIf="isLoading" class="button-spinner" aria-hidden="true"></span>
        <span>{{ isLoading ? 'Creating Account...' : 'Register' }}</span>
      </button>
    </form>

    <!-- Footer Switch Link -->
    <div class="auth-footer">
      <p class="switch-link">
        Already have an account?
        <a routerLink="/login" class="switch-action">Log in here</a>
      </p>
    </div>
  </div>
</div>
