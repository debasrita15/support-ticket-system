# Application Name
spring.application.name=ticketsystem-backend

# Server Port
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketdb
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Configuration
# Secret key must be at least 32 characters (256 bits) for HMAC-SHA256 algorithm
jwt.secret=9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
# Token expiration time: 24 hours (24 * 60 * 60 * 1000 = 86,400,000 ms)
jwt.expiration-ms=86400000

# AI Microservice (FastAPI) URL
ai.service.url=http://localhost:8000
